name: C/C++ Autotools CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu

    steps:
      - name: dependencies
        run: |
          apt-get update
          apt-get install -y libusb-1.0-0-dev librsvg2-dev zlib1g-dev git autoconf libtool make g++ pkgconf swig python3-dev nodejs
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: autoreconf
        run: autoreconf --install --force
      - name: configure
        run: ./configure
      - name: make
        run: make
      - name: test
        run: make check
